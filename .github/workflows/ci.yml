name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    name: Run Unit Tests & Retrieval Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e deliverables/source_code
          pip install pytest pytest-asyncio

      - name: Run Pytest Unit Tests
        run: |
          pytest deliverables/source_code/tests/ -v

      - name: Run Retrieval Benchmark Evaluation
        run: |
          python deliverables/source_code/eval/evaluate_retrieval.py
